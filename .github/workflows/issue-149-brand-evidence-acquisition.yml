# Issue #149 — complete current-baseline Brand evidence acquisition.
#
# Research-only, scoped to exactly one branch. Not part of the required CI checks
# and it touches no production path.
#
# Transport, frozen in workflow-plan.md:
#   - push-triggered, restricted to the single research branch;
#   - paths admitting only this workflow file, the committed mode file and the
#     execute-authorization artifact;
#   - permissions: contents: read — the OCR job cannot push, and the write
#     permission is never granted to any job here;
#   - no schedule, no pull_request_target, no repository_dispatch, no unscoped
#     branch trigger;
#   - a visible harness revision, bumped in the same commit whenever a harness
#     fix needs a rerun;
#   - OCR runs ONLY when the mode is exactly `execute` AND the execute-transition
#     gate passes.
#
# IMPORTANT, and previously stated wrongly in this file: the `paths:` filter
# decides WHETHER this workflow runs when a push touches a matching file. It does
# NOT restrict what else that push contains. A commit could change the mode file
# and the runner in one push and still trigger execute. The changed-file
# restriction is enforced by scripts/eval/issue-149-execute-gate.mjs against the
# actual commit range, not by the trigger.
#
# Every action is pinned to a full commit SHA and the runtime image to a
# linux/amd64 manifest digest: a tag can later resolve to different bytes, and a
# commit SHA and an image digest are the only immutable references.
#
# The committed mode is `discover`. Discovery runs inside the same boundary
# execute will use, runs no OCR, and stops for review.
name: Issue 149 Brand evidence acquisition

on:
  push:
    branches:
      - research/issue-149-brand-complete-evidence-acquisition
    paths:
      - .github/workflows/issue-149-brand-evidence-acquisition.yml
      - artifacts/issue-149-brand-complete-evidence-acquisition/workflow-mode.txt
      - artifacts/issue-149-brand-complete-evidence-acquisition/execute-authorization.json

permissions:
  contents: read

env:
  # harness revision: 14
  ISSUE_149_HARNESS_REVISION: "14"
  MODE_FILE: artifacts/issue-149-brand-complete-evidence-acquisition/workflow-mode.txt
  # linux/amd64 manifest digest for node:20-bookworm-slim, resolved and recorded.
  ISSUE_149_BASE_IMAGE: node@sha256:3d0f05455dea2c82e2f76e7e2543964c30f6b7d673fc1a83286736d44fe4c41c
  ISSUE_149_BASE_IMAGE_TAG: node:20-bookworm-slim
  ISSUE_149_BASE_IMAGE_DIGEST: sha256:3d0f05455dea2c82e2f76e7e2543964c30f6b7d673fc1a83286736d44fe4c41c
  # The pinned non-root runtime identity for the isolated job.
  ISSUE_149_RUNTIME_UID: "10149"
  ISSUE_149_RUNTIME_GID: "10149"

jobs:
  resolve-mode:
    name: Resolve declared mode
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Read and validate the committed mode
        id: mode
        run: |
          set -euo pipefail
          MODE="$(tr -d '[:space:]' < "${MODE_FILE}")"
          case "${MODE}" in
            discover|execute|complete) ;;
            *) echo "MODE_FILE_INVALID: ${MODE}" >&2; exit 1 ;;
          esac
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "declared mode: ${MODE} (harness revision ${ISSUE_149_HARNESS_REVISION})"

  execute-transition-gate:
    name: Execute-transition integrity gate
    needs: resolve-mode
    if: needs.resolve-mode.outputs.mode == 'execute'
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4 — FULL history, because the gate compares the actual
      # commit range against the reviewed implementation SHA.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify the execute transition
        run: node scripts/eval/issue-149-execute-gate.mjs

  job-a-prepare:
    name: Job A — trusted preparation (no OCR)
    needs: resolve-mode
    if: needs.resolve-mode.outputs.mode != 'complete'
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-node v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Trusted, NOT truth-free: the freeze generator reads the PR #217
      # attribution artifact and uses governedTruth.present, and only that, for
      # the 105/10 corpus accounting. The PREPARATION ARTIFACT it emits is what
      # is truth-free.
      - name: Prepare (verify, restage, build the allowlisted bundle, scan)
        run: node scripts/eval/issue-149-job-a-prepare.mjs | tee job-a-report.json

      - name: Record the preparation artifact digest
        run: |
          set -euo pipefail
          shasum -a 256 .local/issue-149-preparation/preparation-artifact.json
          shasum -a 256 .local/issue-149-preparation/bundle/bundle-manifest.json

      # actions/upload-artifact v4
      - name: Upload the truth-free preparation artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-149-truth-free-preparation
          path: .local/issue-149-preparation
          retention-days: 7

      # The HOST verifier bundle. Job B has no checkout, so a verification step
      # that invokes `npx vite-node scripts/eval/...` cannot run there at all.
      # This runs with plain pinned Node and is never mounted into the container.
      # actions/upload-artifact v4
      - name: Upload the host verifier bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-149-host-verifier
          path: .local/issue-149-verifier
          retention-days: 7

      # The MINIMAL Job C inventory, as its own artifact. It is not part of the
      # truth-free acquisition input and is never mounted with it.
      # actions/upload-artifact v4
      - name: Upload the minimal identity inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-149-identity-inventory
          path: .local/issue-149-identity-inventory
          retention-days: 7

      # actions/upload-artifact v4
      - name: Upload the Job A report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-149-job-a-report
          path: job-a-report.json
          retention-days: 7

  job-b-discover:
    name: Job B — isolated discovery (no OCR)
    needs: [resolve-mode, job-a-prepare]
    if: needs.resolve-mode.outputs.mode == 'discover'
    runs-on: ubuntu-latest
    steps:
      # NO repository checkout. Job B receives ONLY the truth-free preparation
      # artifact, and no GitHub token or repository credential enters the
      # container.
      # actions/download-artifact v4
      - name: Download the truth-free preparation artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: issue-149-truth-free-preparation
          path: preparation

      - name: Resolve and record the pinned runtime image
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "${ISSUE_149_BASE_IMAGE}"
          docker image inspect "${ISSUE_149_BASE_IMAGE}" \
            --format '{"id":"{{.Id}}","repoDigests":{{json .RepoDigests}},"os":"{{.Os}}","arch":"{{.Architecture}}"}' \
            | tee image-identity.json
          # The gate: the resolved image must be the pinned digest.
          grep -q "${ISSUE_149_BASE_IMAGE_DIGEST#sha256:}" image-identity.json \
            || { echo "RUNTIME_IMAGE_DIGEST_MISMATCH" >&2; exit 1; }

      - name: Run isolated discovery
        run: |
          set -euo pipefail
          mkdir -p output
          # The pinned non-root identity must own the output transaction.
          sudo chown -R "${ISSUE_149_RUNTIME_UID}:${ISSUE_149_RUNTIME_GID}" output
          docker run --rm \
            --platform linux/amd64 \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --user "${ISSUE_149_RUNTIME_UID}:${ISSUE_149_RUNTIME_GID}" \
            --env-file /dev/null \
            -e ISSUE_149_MODE=discover \
            -e ISSUE_149_HARNESS_REVISION="${ISSUE_149_HARNESS_REVISION}" \
            -e ISSUE_149_EXPECTED_UID="${ISSUE_149_RUNTIME_UID}" \
            -e ISSUE_149_EXPECTED_GID="${ISSUE_149_RUNTIME_GID}" \
            -e ISSUE_149_EXPECTED_IMAGE_DIGEST="${ISSUE_149_BASE_IMAGE_DIGEST}" \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --tmpfs /run:rw,noexec,nosuid,size=16m \
            -v "$PWD/preparation/bundle:/opt/acquisition:ro" \
            -v "$PWD/preparation/input/truth-free-input-manifest.json:/input/truth-free-input-manifest.json:ro" \
            -v "$PWD/preparation/input/images:/input/images:ro" \
            -v "$PWD/output:/output:rw" \
            "${ISSUE_149_BASE_IMAGE}" \
            node /opt/acquisition/acquisition.mjs > discovery-report.json

      - name: Prove the output mount stayed empty and hash the report
        if: always()
        run: |
          set -euo pipefail
          echo "output mount contents:"
          find output -type f | tee output-inventory.txt
          test ! -s output-inventory.txt || { echo "OUTPUT_MOUNT_NOT_EMPTY" >&2; exit 1; }
          shasum -a 256 discovery-report.json | tee discovery-report.sha256

      # ALWAYS. A failing discovery run is exactly the run whose report is worth
      # keeping; earlier attempts produced no artifact because the step that
      # uploads it never ran.
      # actions/upload-artifact v4
      - name: Upload the discovery report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-149-discovery-report
          path: |
            discovery-report.json
            discovery-report.sha256
            output-inventory.txt
            image-identity.json
          retention-days: 30

  job-b-execute:
    name: Job B — isolated acquisition OCR
    needs: [resolve-mode, execute-transition-gate, job-a-prepare]
    outputs:
      forensicArtifactId: ${{ steps.forensicUpload.outputs.artifact-id }}
      forensicArtifactDigest: ${{ steps.forensicUpload.outputs.artifact-digest }}
      forensicArtifactUrl: ${{ steps.forensicUpload.outputs.artifact-url }}
      headSha: ${{ github.sha }}
      acquisitionStatus: ${{ steps.acquire.outputs.status }}
    # THE ONLY OCR. Reachable only when the committed mode is exactly `execute`
    # AND the execute-transition gate passed: the gate is a `needs:` dependency,
    # so a rejected transition prevents this job from starting at all.
    if: needs.resolve-mode.outputs.mode == 'execute'
    runs-on: ubuntu-latest
    steps:
      # actions/download-artifact v4
      - name: Download the truth-free preparation artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: issue-149-truth-free-preparation
          path: preparation

      - name: Resolve and record the pinned runtime image
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "${ISSUE_149_BASE_IMAGE}"
          docker image inspect "${ISSUE_149_BASE_IMAGE}" \
            --format '{"id":"{{.Id}}","repoDigests":{{json .RepoDigests}},"os":"{{.Os}}","arch":"{{.Architecture}}"}' \
            | tee image-identity.json
          grep -q "${ISSUE_149_BASE_IMAGE_DIGEST#sha256:}" image-identity.json \
            || { echo "RUNTIME_IMAGE_DIGEST_MISMATCH" >&2; exit 1; }

      # actions/download-artifact v4
      - name: Download the host verifier bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: issue-149-host-verifier
          path: verifier

      - name: Acquire the primary and repeat runs
        id: acquire
        run: |
          set -uo pipefail
          mkdir -p output
          sudo chown -R "${ISSUE_149_RUNTIME_UID}:${ISSUE_149_RUNTIME_GID}" output
          set +e
          docker run --rm \
            --platform linux/amd64 \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --user "${ISSUE_149_RUNTIME_UID}:${ISSUE_149_RUNTIME_GID}" \
            --env-file /dev/null \
            -e ISSUE_149_MODE=execute \
            -e ISSUE_149_HARNESS_REVISION="${ISSUE_149_HARNESS_REVISION}" \
            -e ISSUE_149_EXPECTED_UID="${ISSUE_149_RUNTIME_UID}" \
            -e ISSUE_149_EXPECTED_GID="${ISSUE_149_RUNTIME_GID}" \
            -e ISSUE_149_EXPECTED_IMAGE_DIGEST="${ISSUE_149_BASE_IMAGE_DIGEST}" \
            --tmpfs /tmp:rw,noexec,nosuid,size=512m \
            --tmpfs /run:rw,noexec,nosuid,size=16m \
            -v "$PWD/preparation/bundle:/opt/acquisition:ro" \
            -v "$PWD/preparation/input/truth-free-input-manifest.json:/input/truth-free-input-manifest.json:ro" \
            -v "$PWD/preparation/input/images:/input/images:ro" \
            -v "$PWD/output:/output:rw" \
            "${ISSUE_149_BASE_IMAGE}" \
            node /opt/acquisition/acquisition.mjs > acquisition-report.json
          ACQUIRE_STATUS=$?
          set -e
          # CAPTURED, not fatal. The path most in need of forensic verification
          # is a failed acquisition, and letting `set -e` end the job here is
          # exactly what skipped it. Adjudication happens after preservation.
          echo "{\"exitStatus\": ${ACQUIRE_STATUS}}" > acquisition-status.json
          echo "status=${ACQUIRE_STATUS}" >> "$GITHUB_OUTPUT"
          cat acquisition-status.json

      - name: Trusted host forensic handoff
        id: handoff
        if: always()
        run: |
          set -euo pipefail
          HOST_UID="$(id -u)"
          HOST_GID="$(id -g)"
          NODE_BIN="$(command -v node)"
          sudo -E "${NODE_BIN}" verifier/forensic-handoff.mjs \
            --source output \
            --out forensic-handoff \
            --snapshot host-readable-output \
            --host-uid "${HOST_UID}" \
            --host-gid "${HOST_GID}" \
            --acquisition-status "${{ steps.acquire.outputs.status }}" \
            | tee forensic-handoff-report.json
          test -f forensic-handoff/source-pre-manifest.json
          test -f forensic-handoff/source-post-manifest.json
          test -f forensic-handoff/source-tree.tar
          test -f forensic-handoff/snapshot-manifest.json
          test -f forensic-handoff/handoff-receipt.json
          shasum -a 256 forensic-handoff/source-tree.tar | tee forensic-handoff/source-tree.tar.sha256
          shasum -a 256 forensic-handoff/source-pre-manifest.json | tee forensic-handoff/source-pre-manifest.sha256
          shasum -a 256 forensic-handoff/source-post-manifest.json | tee forensic-handoff/source-post-manifest.sha256
          shasum -a 256 forensic-handoff/snapshot-manifest.json | tee forensic-handoff/snapshot-manifest.sha256
          shasum -a 256 forensic-handoff/handoff-receipt.json | tee forensic-handoff/handoff-receipt.sha256

      # actions/upload-artifact v4
      - name: Upload unverified forensic handoff
        id: forensicUpload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-149-unverified-forensic-handoff
          path: |
            forensic-handoff
            host-readable-output
            forensic-handoff-report.json
            acquisition-report.json
            acquisition-status.json
            image-identity.json
          if-no-files-found: error
          retention-days: 30

  verify-forensic-handoff:
    name: Verify forensic handoff by exact artifact ID
    needs: [resolve-mode, job-b-execute]
    if: always() && needs.resolve-mode.outputs.mode == 'execute'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Narrowly scoped, only to read this run's artifact metadata.
      actions: read
    steps:
      - name: Require the artifact identity outputs
        run: |
          set -euo pipefail
          test -n "${{ needs.job-b-execute.outputs.headSha }}" || {
            echo "PRODUCING_HEAD_SHA_ABSENT" >&2; exit 1; }
          test -n "${{ needs.job-b-execute.outputs.forensicArtifactId }}" || {
            echo "FORENSIC_ARTIFACT_ID_ABSENT" >&2; exit 1; }
          test -n "${{ needs.job-b-execute.outputs.forensicArtifactDigest }}" || {
            echo "FORENSIC_ARTIFACT_DIGEST_ABSENT" >&2; exit 1; }

      # actions/download-artifact v4
      - name: Redownload forensic handoff by exact artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.job-b-execute.outputs.forensicArtifactId }}
          merge-multiple: true
          path: forensic-redownload

      - name: Verify the forensic handoff artifact metadata and manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${{ needs.job-b-execute.outputs.forensicArtifactId }}" \
            > forensic-artifact-metadata.json
          FORENSIC_METADATA_DIGEST=$(python3 -c "import json;print(json.load(open('forensic-artifact-metadata.json')).get('digest',''))")
          FORENSIC_METADATA_RUN=$(python3 -c "import json;print(json.load(open('forensic-artifact-metadata.json')).get('workflow_run',{}).get('id',''))")
          test "${FORENSIC_METADATA_RUN}" = "${GITHUB_RUN_ID}" || {
            echo "FORENSIC_ARTIFACT_RUN_ASSOCIATION_MISMATCH" >&2; exit 1; }
          FORENSIC_UPLOAD_DIGEST="${{ needs.job-b-execute.outputs.forensicArtifactDigest }}"
          test -n "${FORENSIC_METADATA_DIGEST#sha256:}" || {
            echo "FORENSIC_ARTIFACT_METADATA_DIGEST_ABSENT" >&2; exit 1; }
          test "${FORENSIC_METADATA_DIGEST#sha256:}" = "${FORENSIC_UPLOAD_DIGEST#sha256:}" || {
            echo "FORENSIC_ARTIFACT_DIGEST_MISMATCH: ${FORENSIC_METADATA_DIGEST} vs ${FORENSIC_UPLOAD_DIGEST}" >&2; exit 1; }
          export FORENSIC_METADATA_DIGEST FORENSIC_UPLOAD_DIGEST
          python3 - <<'PY'
          import hashlib, json, os, pathlib, sys
          root = pathlib.Path("forensic-redownload/forensic-handoff")
          receipt = json.loads((root / "handoff-receipt.json").read_text())
          def digest(p):
            return hashlib.sha256(p.read_bytes()).hexdigest()
          required = ["source-pre-manifest.json", "source-post-manifest.json", "source-tree.tar", "snapshot-manifest.json", "handoff-receipt.json"]
          checks = {
            "requiredComponents": all((root / name).exists() and receipt["requiredComponentInventory"].get(name) is True for name in required),
            "forensicArchiveDigest": digest(root / "source-tree.tar") == receipt["archiveDigest"],
            "forensicArchiveLength": (root / "source-tree.tar").stat().st_size == receipt["archiveLength"],
            "sourcePreManifestDigest": digest(root / "source-pre-manifest.json") == receipt["sourcePreManifestDigest"],
            "sourcePostManifestDigest": digest(root / "source-post-manifest.json") == receipt["sourcePostManifestDigest"],
            "snapshotManifestDigest": digest(root / "snapshot-manifest.json") == receipt["snapshotManifestDigest"],
            "contentEquivalent": receipt["contentEquivalent"] is True,
            "sourceNotMutated": receipt["sourceMutated"] is False,
            "hostReadable": receipt["hostReadable"] is True,
          }
          if not all(checks.values()):
            print(json.dumps(checks, indent=2), file=sys.stderr)
            sys.exit(1)
          pathlib.Path("forensic-redownload-receipt.json").write_text(json.dumps({
            "artifactId": "${{ needs.job-b-execute.outputs.forensicArtifactId }}",
            "artifactDigest": os.environ["FORENSIC_UPLOAD_DIGEST"],
            "metadataDigest": os.environ["FORENSIC_METADATA_DIGEST"],
            "checks": checks,
            "finalStatus": "VERIFIED"
          }, indent=2) + "\n")
          PY

      # actions/upload-artifact v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue-149-forensic-handoff-receipt
          path: |
            forensic-artifact-metadata.json
            forensic-redownload-receipt.json
          retention-days: 30

  job-b-verify-evidence:
    name: Actor 2 and Job C on host-readable snapshot
    needs: [resolve-mode, job-b-execute, verify-forensic-handoff]
    if: needs.resolve-mode.outputs.mode == 'execute'
    runs-on: ubuntu-latest
    outputs:
      artifactId: ${{ steps.upload.outputs.artifact-id }}
      artifactDigest: ${{ steps.upload.outputs.artifact-digest }}
      artifactUrl: ${{ steps.upload.outputs.artifact-url }}
      overLimit: ${{ steps.volume.outputs.overLimit }}
      rawBytes: ${{ steps.volume.outputs.rawBytes }}
      rawVerified: ${{ steps.raw.outputs.verified }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.job-b-execute.outputs.forensicArtifactId }}
          merge-multiple: true
          path: forensic-redownload
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: issue-149-host-verifier
          path: verifier
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: issue-149-truth-free-preparation
          path: preparation

      - name: Actor 2 — verify the sealed raw evidence
        id: raw
        if: always()
        run: |
          set +e
          node verifier/verify.mjs \
            --raw forensic-redownload/host-readable-output/raw \
            --manifest preparation/input/truth-free-input-manifest.json \
            --report raw-verification-report.json
          RAW_STATUS=$?
          set -e
          echo "status=${RAW_STATUS}" >> "$GITHUB_OUTPUT"
          echo "verified=$([ "${RAW_STATUS}" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Download the minimal identity inventory
        if: steps.raw.outputs.verified == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: issue-149-identity-inventory
          path: identity

      - name: Job C — historical identity-leak verification
        id: identity
        if: steps.raw.outputs.verified == 'true'
        run: |
          set -euo pipefail
          node verifier/verify.mjs \
            --raw forensic-redownload/host-readable-output/raw \
            --manifest preparation/input/truth-free-input-manifest.json \
            --identity \
            --identity-inventory identity/identity-inventory.json \
            --identity-manifest identity/identity-inventory-manifest.json \
            --report identity-leak-report.json

      - name: Measure the archive volume (nonfatal)
        id: volume
        if: steps.raw.outputs.verified == 'true' && steps.identity.outcome == 'success'
        run: |
          set -euo pipefail
          BYTES=$(du -sb forensic-redownload/host-readable-output | cut -f1)
          node verifier/archive-volume.mjs --bytes "${BYTES}" --report archive-volume-report.json
          OVER=$(python3 -c "import json;print(str(json.load(open('archive-volume-report.json'))['overLimit']).lower())")
          echo "overLimit=${OVER}" >> "$GITHUB_OUTPUT"
          echo "rawBytes=${BYTES}" >> "$GITHUB_OUTPUT"

      - name: Upload the verified raw evidence
        id: upload
        if: steps.raw.outputs.verified == 'true' && steps.identity.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-149-raw-evidence
          path: |
            forensic-redownload/host-readable-output
            forensic-redownload/forensic-handoff
            forensic-redownload/acquisition-report.json
            forensic-redownload/acquisition-status.json
            forensic-redownload/image-identity.json
            raw-verification-report.json
            identity-leak-report.json
            archive-volume-report.json
          retention-days: 30

      - name: Upload incomplete forensic output
        if: steps.raw.outputs.verified != 'true' || steps.identity.outcome != 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-149-incomplete-forensic-output
          path: |
            forensic-redownload
            raw-verification-report.json
            identity-leak-report.json
          retention-days: 30

  verify-uploaded-artifact:
    name: Verify the uploaded complete evidence artifact
    needs: [resolve-mode, job-b-execute, job-b-verify-evidence]
    if: needs.resolve-mode.outputs.mode == 'execute' && needs.job-b-verify-evidence.outputs.rawVerified == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require complete evidence artifact identity
        run: |
          set -euo pipefail
          test -n "${{ needs.job-b-verify-evidence.outputs.artifactId }}" || {
            echo "ARTIFACT_ID_ABSENT" >&2; exit 1; }
          test -n "${{ needs.job-b-verify-evidence.outputs.artifactDigest }}" || {
            echo "ARTIFACT_DIGEST_ABSENT" >&2; exit 1; }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.job-b-verify-evidence.outputs.artifactId }}
          merge-multiple: true
          path: downloaded
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: issue-149-host-verifier
          path: verifier
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: issue-149-truth-free-preparation
          path: preparation
      - name: Re-verify downloaded complete evidence and receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${{ needs.job-b-verify-evidence.outputs.artifactId }}" \
            > artifact-metadata.json
          METADATA_DIGEST=$(python3 -c "import json;print(json.load(open('artifact-metadata.json')).get('digest',''))")
          UPLOAD_DIGEST="${{ needs.job-b-verify-evidence.outputs.artifactDigest }}"
          test "${METADATA_DIGEST#sha256:}" = "${UPLOAD_DIGEST#sha256:}" || {
            echo "ARTIFACT_DIGEST_MISMATCH: ${METADATA_DIGEST} vs ${UPLOAD_DIGEST}" >&2; exit 1; }
          node verifier/verify.mjs \
            --raw downloaded/host-readable-output/raw \
            --manifest preparation/input/truth-free-input-manifest.json \
            --report downloaded-verification-report.json
          RAW_DIGEST=$(sha256sum downloaded-verification-report.json | cut -d" " -f1)
          OVER="${{ needs.job-b-verify-evidence.outputs.overLimit }}"
          DECISION=$([ "${OVER}" = "true" ] \
            && echo "DURABLE_ARCHIVE_DECISION_REQUIRED" \
            || echo "ELIGIBLE_FOR_OWNER_COMMIT_PROCESS")
          cat > verification-receipt.json <<JSON
          {
            "artifactId": "${{ needs.job-b-verify-evidence.outputs.artifactId }}",
            "forensicArtifactId": "${{ needs.job-b-execute.outputs.forensicArtifactId }}",
            "uploadDigest": "${{ needs.job-b-verify-evidence.outputs.artifactDigest }}",
            "metadataDigest": "${METADATA_DIGEST}",
            "artifactUrl": "${{ needs.job-b-verify-evidence.outputs.artifactUrl }}",
            "headSha": "${{ needs.job-b-execute.outputs.headSha }}",
            "rawVerificationReportDigest": "${RAW_DIGEST}",
            "rawBytes": ${{ needs.job-b-verify-evidence.outputs.rawBytes }},
            "archiveLimitBytes": 104857600,
            "overLimit": ${OVER},
            "decision": "${DECISION}",
            "retentionBound": true,
            "isPermanentPreservation": false,
            "finalStatus": "VERIFIED"
          }
          JSON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue-149-verification-receipt
          path: |
            verification-receipt.json
            artifact-metadata.json
            downloaded-verification-report.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # TERMINAL archive adjudication. It runs only after the verified artifact, the
  # exact-ID redownload, the digest comparison, the content re-verification and
  # the receipt all exist — so an over-limit stop can never destroy the evidence
  # it is protecting.
  # ---------------------------------------------------------------------------
  archive-adjudication:
    name: Terminal archive-volume adjudication
    needs: [resolve-mode, job-b-verify-evidence, verify-uploaded-artifact]
    if: needs.resolve-mode.outputs.mode == 'execute' && needs.job-b-verify-evidence.outputs.rawVerified == 'true'
    runs-on: ubuntu-latest
    steps:
      # actions/download-artifact v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: issue-149-verification-receipt
          path: receipt
      # actions/download-artifact v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: issue-149-host-verifier
          path: verifier

      - name: Adjudicate the archive volume, after preservation
        run: |
          set -euo pipefail
          python3 -c "
          import json
          r = json.load(open('receipt/verification-receipt.json'))
          json.dump({
            'rawBytes': r['rawBytes'],
            'archiveLimitBytes': r['archiveLimitBytes'],
            'overLimit': r['overLimit'],
            'decision': r['decision'],
            'uploadAndVerificationRequired': True,
            'routeAsIncompleteForensicOutput': False,
            'haltCode': 'RAW_EVIDENCE_EXCEEDS_DURABLE_ARCHIVE_LIMIT' if r['overLimit'] else None,
            'meaning': r['decision'],
          }, open('archive-volume-report.json','w'))
          "
          node verifier/archive-adjudication.mjs \
            --volume-report archive-volume-report.json \
            --artifact-id "${{ needs.job-b-verify-evidence.outputs.artifactId }}" \
            --receipt receipt/verification-receipt.json

  acquisition-adjudication:
    name: Terminal acquisition adjudication after forensic receipt
    needs: [resolve-mode, job-b-execute, verify-forensic-handoff, job-b-verify-evidence]
    if: always() && needs.resolve-mode.outputs.mode == 'execute'
    runs-on: ubuntu-latest
    steps:
      - name: Adjudicate after forensic preservation
        run: |
          set -euo pipefail
          echo "acquisition exit: ${{ needs.job-b-execute.outputs.acquisitionStatus }}"
          echo "forensic receipt job: ${{ needs.verify-forensic-handoff.result }}"
          echo "actor 2 verified: ${{ needs.job-b-verify-evidence.outputs.rawVerified }}"
          test "${{ needs.verify-forensic-handoff.result }}" = "success" || {
            echo "FORENSIC_HANDOFF_RECEIPT_NOT_VERIFIED" >&2; exit 1; }
          test "${{ needs.job-b-verify-evidence.outputs.rawVerified }}" = "true" || {
            echo "ACQUISITION_NOT_VERIFIED" >&2; exit 1; }
          test "${{ needs.job-b-execute.outputs.acquisitionStatus }}" = "0" || {
            echo "ACQUISITION_RUNNER_REPORTED_FAILURE" >&2; exit 1; }

  # ---------------------------------------------------------------------------
  # The NO-OCR verifier-transport rehearsal.
  #
  # The execute job is skipped under `discover`, so ordinary rediscovery never
  # exercises the host-side verification path at all. This job does — with no
  # checkout, plain Node, synthetic evidence, and no acquisition, extractor, OCR
  # or governed raw evidence anywhere in it. It is the executable proof that the
  # dormant host-side pipeline can actually run in a no-checkout job.
  # ---------------------------------------------------------------------------
  verifier-transport-rehearsal:
    name: Verifier-transport rehearsal (no OCR)
    needs: [resolve-mode, job-a-prepare]
    if: needs.resolve-mode.outputs.mode == 'discover'
    runs-on: ubuntu-latest
    steps:
      # NO repository checkout, deliberately.
      # actions/download-artifact v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: issue-149-host-verifier
          path: verifier

      - name: Resolve and record the pinned runtime image
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "${ISSUE_149_BASE_IMAGE}"
          docker image inspect "${ISSUE_149_BASE_IMAGE}" \
            --format '{"id":"{{.Id}}","repoDigests":{{json .RepoDigests}},"os":"{{.Os}}","arch":"{{.Architecture}}"}' \
            | tee rehearsal-image-identity.json
          grep -q "${ISSUE_149_BASE_IMAGE_DIGEST#sha256:}" rehearsal-image-identity.json \
            || { echo "RUNTIME_IMAGE_DIGEST_MISMATCH" >&2; exit 1; }

      - name: Build synthetic evidence inside the pinned container
        run: |
          set -euo pipefail
          test ! -f package.json || { echo "UNEXPECTED_CHECKOUT" >&2; exit 1; }
          mkdir -p synthetic-container
          sudo chown -R "${ISSUE_149_RUNTIME_UID}:${ISSUE_149_RUNTIME_GID}" synthetic-container
          docker run --rm \
            --platform linux/amd64 \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --user "${ISSUE_149_RUNTIME_UID}:${ISSUE_149_RUNTIME_GID}" \
            --env-file /dev/null \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --tmpfs /run:rw,noexec,nosuid,size=16m \
            -v "$PWD/verifier:/opt/verifier:ro" \
            -v "$PWD/synthetic-container:/output:rw" \
            "${ISSUE_149_BASE_IMAGE}" \
            sh -c 'umask 077; node /opt/verifier/rehearsal-evidence.mjs /output'
          test "$(stat -c '%u:%g' synthetic-container/raw/primary/item-9001)" = "${ISSUE_149_RUNTIME_UID}:${ISSUE_149_RUNTIME_GID}"
          test "$(stat -c '%a' synthetic-container/planted-unreadable-0700/raw/primary/item-9001)" = "700"

      - name: Prove planted 0700 evidence is unreadable before handoff
        run: |
          set +e
          find synthetic-container/planted-unreadable-0700/raw/primary/item-9001 -maxdepth 1 -type f > planted-before-handoff.txt 2> planted-before-handoff.err
          STATUS=$?
          set -e
          test "${STATUS}" -ne 0 || { echo "PLANTED_0700_WAS_READABLE_BEFORE_HANDOFF" >&2; exit 1; }
          echo "planted 0700 unreadable before handoff with status ${STATUS}" | tee planted-0700-proof.txt

      - name: Run the real forensic handoff for rehearsal
        run: |
          set -euo pipefail
          HOST_UID="$(id -u)"
          HOST_GID="$(id -g)"
          NODE_BIN="$(command -v node)"
          sudo -E "${NODE_BIN}" verifier/forensic-handoff.mjs \
            --source synthetic-container \
            --out rehearsal-forensic-handoff \
            --snapshot synthetic-snapshot \
            --host-uid "${HOST_UID}" \
            --host-gid "${HOST_GID}" \
            --acquisition-status 0 \
            | tee rehearsal-forensic-handoff-report.json
          test "$(stat -c '%u:%g' synthetic-snapshot/raw/primary/item-9001)" = "${HOST_UID}:${HOST_GID}"
          find synthetic-snapshot -type d -exec test "$(stat -c '%a' {})" = "755" \;
          find synthetic-snapshot -type f -exec test "$(stat -c '%a' {})" = "644" \;
          test -f rehearsal-forensic-handoff/source-tree.tar
          test -s rehearsal-forensic-handoff/source-tree.tar
          test -f rehearsal-forensic-handoff/handoff-receipt.json

      - name: Actor 2 runs with plain Node and no checkout
        run: |
          set -euo pipefail
          test ! -f package.json || { echo "UNEXPECTED_CHECKOUT" >&2; exit 1; }
          node verifier/verify.mjs \
            --raw synthetic-snapshot/raw \
            --manifest synthetic-snapshot/expected-items.json \
            --report rehearsal-raw-report.json

      # actions/download-artifact v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: issue-149-identity-inventory
          path: identity

      - name: Job C runs, and a MISSING inventory halts
        run: |
          set -euo pipefail
          node verifier/verify.mjs \
            --raw synthetic-snapshot/raw \
            --manifest synthetic-snapshot/expected-items.json \
            --identity \
            --identity-inventory identity/identity-inventory.json \
            --identity-manifest identity/identity-inventory-manifest.json \
            --report rehearsal-identity-report.json

          # …and with the inventory absent it MUST fail. A zero-marker scan is
          # never a clean scan.
          set +e
          node verifier/verify.mjs \
            --raw synthetic-snapshot/raw \
            --manifest synthetic-snapshot/expected-items.json \
            --identity \
            --identity-inventory identity/absent.json \
            --identity-manifest identity/absent-manifest.json \
            --report rehearsal-absent-report.json
          ABSENT_STATUS=$?
          set -e
          test "${ABSENT_STATUS}" -ne 0 || {
            echo "MISSING_INVENTORY_DID_NOT_HALT" >&2; exit 1; }
          echo "missing inventory halted with status ${ABSENT_STATUS}"

      - name: Planted failures must fail
        run: |
          set -euo pipefail
          for PLANT in missing-marker phantom-manifest-entry unreadable-0700; do
            set +e
            node verifier/verify.mjs \
              --raw "synthetic-snapshot/planted-${PLANT}/raw" \
              --manifest synthetic-snapshot/expected-items.json \
              --report "rehearsal-${PLANT}-report.json"
            STATUS=$?
            set -e
            test "${STATUS}" -ne 0 || {
              echo "PLANTED_${PLANT}_DID_NOT_FAIL" >&2; exit 1; }
            echo "planted ${PLANT} failed as required"
          done

      # actions/upload-artifact v4
      - name: Upload the synthetic evidence, then redownload by ID
        id: rehearsalUpload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-149-rehearsal-roundtrip
          path: |
            synthetic-snapshot/raw
            synthetic-snapshot/expected-items.json
            synthetic-snapshot/planted-unreadable-0700
            rehearsal-forensic-handoff
            planted-0700-proof.txt
          if-no-files-found: error
          retention-days: 1

      # actions/download-artifact v4 — see the note above on merge-multiple.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.rehearsalUpload.outputs.artifact-id }}
          merge-multiple: true
          path: roundtrip

      - name: Verify the round-tripped artifact identity and contents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${{ steps.rehearsalUpload.outputs.artifact-id }}" \
            > rehearsal-artifact-metadata.json
          META=$(python3 -c "import json;print(json.load(open('rehearsal-artifact-metadata.json')).get('digest',''))")
          UP="${{ steps.rehearsalUpload.outputs.artifact-digest }}"
          test "${META#sha256:}" = "${UP#sha256:}" || {
            echo "REHEARSAL_ARTIFACT_DIGEST_MISMATCH: ${META} vs ${UP}" >&2; exit 1; }
          node verifier/verify.mjs \
            --raw roundtrip/raw \
            --manifest roundtrip/expected-items.json \
            --report rehearsal-roundtrip-report.json
          echo "round-trip digest verified: ${META}"

      # The OVER-LIMIT ordering, rehearsed with a synthetic byte count. It proves
      # the artifact round trip and the receipt happen BEFORE the deliberate
      # terminal halt — the ordering whose absence would have destroyed the
      # evidence the limit exists to protect.
      - name: Rehearse the over-limit ordering
        run: |
          set -euo pipefail
          # 1. the measurement is NONFATAL, even one byte over.
          node verifier/archive-volume.mjs --bytes 104857601 --report over-limit-report.json
          echo "measurement exited 0 while over the limit"
          python3 -c "
          import json,sys
          r=json.load(open('over-limit-report.json'))
          assert r['overLimit'] is True, r
          assert r['decision']=='DURABLE_ARCHIVE_DECISION_REQUIRED', r
          assert r['routeAsIncompleteForensicOutput'] is False, r
          assert r['uploadAndVerificationRequired'] is True, r
          "

          # 2. adjudicating BEFORE preservation must refuse.
          set +e
          node verifier/archive-adjudication.mjs --volume-report over-limit-report.json --artifact-id "" --receipt missing.json
          EARLY=$?
          set -e
          test "${EARLY}" -ne 0 || { echo "ADJUDICATED_BEFORE_PRESERVATION" >&2; exit 1; }
          echo "adjudication before preservation refused, status ${EARLY}"

          # 3. with the artifact and receipt present, the over-limit halt fires.
          echo '{"finalStatus":"VERIFIED"}' > rehearsal-receipt.json
          set +e
          node verifier/archive-adjudication.mjs --volume-report over-limit-report.json --artifact-id 12345 --receipt rehearsal-receipt.json
          LATE=$?
          set -e
          test "${LATE}" -ne 0 || { echo "OVER_LIMIT_DID_NOT_HALT" >&2; exit 1; }
          echo "over-limit halted AFTER preservation, status ${LATE}"

          # 4. and at the limit exactly, it does not.
          node verifier/archive-volume.mjs --bytes 104857600 --report at-limit-report.json
          node verifier/archive-adjudication.mjs --volume-report at-limit-report.json --artifact-id 12345 --receipt rehearsal-receipt.json
          echo "at the limit: eligible"

      # actions/upload-artifact v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue-149-rehearsal-reports
          path: |
            rehearsal-*.json
            over-limit-report.json
            at-limit-report.json
          retention-days: 7
