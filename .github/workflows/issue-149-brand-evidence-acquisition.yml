# Issue #149 — complete current-baseline Brand evidence acquisition.
#
# Research-only, scoped to exactly one branch. Not part of the required CI checks
# and it touches no production path.
#
# Transport, frozen in workflow-plan.md:
#   - push-triggered, restricted to the single research branch;
#   - paths admitting only this workflow file, the committed mode file and the
#     execute-authorization artifact;
#   - permissions: contents: read — the OCR job cannot push, and the write
#     permission is never granted to any job here;
#   - no schedule, no pull_request_target, no repository_dispatch, no unscoped
#     branch trigger;
#   - a visible harness revision, bumped in the same commit whenever a harness
#     fix needs a rerun;
#   - OCR runs ONLY when the mode is exactly `execute` AND the execute-transition
#     gate passes.
#
# IMPORTANT, and previously stated wrongly in this file: the `paths:` filter
# decides WHETHER this workflow runs when a push touches a matching file. It does
# NOT restrict what else that push contains. A commit could change the mode file
# and the runner in one push and still trigger execute. The changed-file
# restriction is enforced by scripts/eval/issue-149-execute-gate.mjs against the
# actual commit range, not by the trigger.
#
# Every action is pinned to a full commit SHA and the runtime image to a
# linux/amd64 manifest digest: a tag can later resolve to different bytes, and a
# commit SHA and an image digest are the only immutable references.
#
# The committed mode is `discover`. Discovery runs inside the same boundary
# execute will use, runs no OCR, and stops for review.
name: Issue 149 Brand evidence acquisition

on:
  push:
    branches:
      - research/issue-149-brand-complete-evidence-acquisition
    paths:
      - .github/workflows/issue-149-brand-evidence-acquisition.yml
      - artifacts/issue-149-brand-complete-evidence-acquisition/workflow-mode.txt
      - artifacts/issue-149-brand-complete-evidence-acquisition/execute-authorization.json

permissions:
  contents: read

env:
  # harness revision: 12
  ISSUE_149_HARNESS_REVISION: "12"
  MODE_FILE: artifacts/issue-149-brand-complete-evidence-acquisition/workflow-mode.txt
  # linux/amd64 manifest digest for node:20-bookworm-slim, resolved and recorded.
  ISSUE_149_BASE_IMAGE: node@sha256:3d0f05455dea2c82e2f76e7e2543964c30f6b7d673fc1a83286736d44fe4c41c
  ISSUE_149_BASE_IMAGE_TAG: node:20-bookworm-slim
  ISSUE_149_BASE_IMAGE_DIGEST: sha256:3d0f05455dea2c82e2f76e7e2543964c30f6b7d673fc1a83286736d44fe4c41c
  # The pinned non-root runtime identity for the isolated job.
  ISSUE_149_RUNTIME_UID: "10149"
  ISSUE_149_RUNTIME_GID: "10149"

jobs:
  resolve-mode:
    name: Resolve declared mode
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Read and validate the committed mode
        id: mode
        run: |
          set -euo pipefail
          MODE="$(tr -d '[:space:]' < "${MODE_FILE}")"
          case "${MODE}" in
            discover|execute|complete) ;;
            *) echo "MODE_FILE_INVALID: ${MODE}" >&2; exit 1 ;;
          esac
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "declared mode: ${MODE} (harness revision ${ISSUE_149_HARNESS_REVISION})"

  execute-transition-gate:
    name: Execute-transition integrity gate
    needs: resolve-mode
    if: needs.resolve-mode.outputs.mode == 'execute'
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4 — FULL history, because the gate compares the actual
      # commit range against the reviewed implementation SHA.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify the execute transition
        run: node scripts/eval/issue-149-execute-gate.mjs

  job-a-prepare:
    name: Job A — trusted preparation (no OCR)
    needs: resolve-mode
    if: needs.resolve-mode.outputs.mode != 'complete'
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-node v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Trusted, NOT truth-free: the freeze generator reads the PR #217
      # attribution artifact and uses governedTruth.present, and only that, for
      # the 105/10 corpus accounting. The PREPARATION ARTIFACT it emits is what
      # is truth-free.
      - name: Prepare (verify, restage, build the allowlisted bundle, scan)
        run: node scripts/eval/issue-149-job-a-prepare.mjs | tee job-a-report.json

      - name: Record the preparation artifact digest
        run: |
          set -euo pipefail
          shasum -a 256 .local/issue-149-preparation/preparation-artifact.json
          shasum -a 256 .local/issue-149-preparation/bundle/bundle-manifest.json

      # actions/upload-artifact v4
      - name: Upload the truth-free preparation artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-149-truth-free-preparation
          path: .local/issue-149-preparation
          retention-days: 7

      # The HOST verifier bundle. Job B has no checkout, so a verification step
      # that invokes `npx vite-node scripts/eval/...` cannot run there at all.
      # This runs with plain pinned Node and is never mounted into the container.
      # actions/upload-artifact v4
      - name: Upload the host verifier bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-149-host-verifier
          path: .local/issue-149-verifier
          retention-days: 7

      # The MINIMAL Job C inventory, as its own artifact. It is not part of the
      # truth-free acquisition input and is never mounted with it.
      # actions/upload-artifact v4
      - name: Upload the minimal identity inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-149-identity-inventory
          path: .local/issue-149-identity-inventory
          retention-days: 7

      # Synthetic evidence for the no-OCR rehearsal. No acquisition API, no
      # extractor, no OCR, no governed corpus — synthetic item IDs only.
      - name: Build the synthetic rehearsal evidence
        run: npx vite-node --config vitest.config.ts scripts/eval/issue-149-build-rehearsal-evidence.ts -- .local/issue-149-rehearsal

      # actions/upload-artifact v4
      - name: Upload the synthetic rehearsal evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-149-synthetic-rehearsal-evidence
          path: .local/issue-149-rehearsal
          retention-days: 7

      # actions/upload-artifact v4
      - name: Upload the Job A report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-149-job-a-report
          path: job-a-report.json
          retention-days: 7

  job-b-discover:
    name: Job B — isolated discovery (no OCR)
    needs: [resolve-mode, job-a-prepare]
    if: needs.resolve-mode.outputs.mode == 'discover'
    runs-on: ubuntu-latest
    steps:
      # NO repository checkout. Job B receives ONLY the truth-free preparation
      # artifact, and no GitHub token or repository credential enters the
      # container.
      # actions/download-artifact v4
      - name: Download the truth-free preparation artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: issue-149-truth-free-preparation
          path: preparation

      - name: Resolve and record the pinned runtime image
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "${ISSUE_149_BASE_IMAGE}"
          docker image inspect "${ISSUE_149_BASE_IMAGE}" \
            --format '{"id":"{{.Id}}","repoDigests":{{json .RepoDigests}},"os":"{{.Os}}","arch":"{{.Architecture}}"}' \
            | tee image-identity.json
          # The gate: the resolved image must be the pinned digest.
          grep -q "${ISSUE_149_BASE_IMAGE_DIGEST#sha256:}" image-identity.json \
            || { echo "RUNTIME_IMAGE_DIGEST_MISMATCH" >&2; exit 1; }

      - name: Run isolated discovery
        run: |
          set -euo pipefail
          mkdir -p output
          # The pinned non-root identity must own the output transaction.
          sudo chown -R "${ISSUE_149_RUNTIME_UID}:${ISSUE_149_RUNTIME_GID}" output
          docker run --rm \
            --platform linux/amd64 \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --user "${ISSUE_149_RUNTIME_UID}:${ISSUE_149_RUNTIME_GID}" \
            --env-file /dev/null \
            -e ISSUE_149_MODE=discover \
            -e ISSUE_149_HARNESS_REVISION="${ISSUE_149_HARNESS_REVISION}" \
            -e ISSUE_149_EXPECTED_UID="${ISSUE_149_RUNTIME_UID}" \
            -e ISSUE_149_EXPECTED_GID="${ISSUE_149_RUNTIME_GID}" \
            -e ISSUE_149_EXPECTED_IMAGE_DIGEST="${ISSUE_149_BASE_IMAGE_DIGEST}" \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --tmpfs /run:rw,noexec,nosuid,size=16m \
            -v "$PWD/preparation/bundle:/opt/acquisition:ro" \
            -v "$PWD/preparation/input/truth-free-input-manifest.json:/input/truth-free-input-manifest.json:ro" \
            -v "$PWD/preparation/input/images:/input/images:ro" \
            -v "$PWD/output:/output:rw" \
            "${ISSUE_149_BASE_IMAGE}" \
            node /opt/acquisition/acquisition.mjs > discovery-report.json

      - name: Prove the output mount stayed empty and hash the report
        if: always()
        run: |
          set -euo pipefail
          echo "output mount contents:"
          find output -type f | tee output-inventory.txt
          test ! -s output-inventory.txt || { echo "OUTPUT_MOUNT_NOT_EMPTY" >&2; exit 1; }
          shasum -a 256 discovery-report.json | tee discovery-report.sha256

      # ALWAYS. A failing discovery run is exactly the run whose report is worth
      # keeping; earlier attempts produced no artifact because the step that
      # uploads it never ran.
      # actions/upload-artifact v4
      - name: Upload the discovery report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-149-discovery-report
          path: |
            discovery-report.json
            discovery-report.sha256
            output-inventory.txt
            image-identity.json
          retention-days: 30

  job-b-execute:
    name: Job B — isolated acquisition OCR
    needs: [resolve-mode, execute-transition-gate, job-a-prepare]
    outputs:
      artifactId: ${{ steps.upload.outputs.artifact-id }}
      artifactDigest: ${{ steps.upload.outputs.artifact-digest }}
      artifactUrl: ${{ steps.upload.outputs.artifact-url }}
      headSha: ${{ github.sha }}
    # THE ONLY OCR. Reachable only when the committed mode is exactly `execute`
    # AND the execute-transition gate passed: the gate is a `needs:` dependency,
    # so a rejected transition prevents this job from starting at all.
    if: needs.resolve-mode.outputs.mode == 'execute'
    runs-on: ubuntu-latest
    steps:
      # actions/download-artifact v4
      - name: Download the truth-free preparation artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: issue-149-truth-free-preparation
          path: preparation

      - name: Resolve and record the pinned runtime image
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "${ISSUE_149_BASE_IMAGE}"
          docker image inspect "${ISSUE_149_BASE_IMAGE}" \
            --format '{"id":"{{.Id}}","repoDigests":{{json .RepoDigests}},"os":"{{.Os}}","arch":"{{.Architecture}}"}' \
            | tee image-identity.json
          grep -q "${ISSUE_149_BASE_IMAGE_DIGEST#sha256:}" image-identity.json \
            || { echo "RUNTIME_IMAGE_DIGEST_MISMATCH" >&2; exit 1; }

      # actions/download-artifact v4
      - name: Download the host verifier bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: issue-149-host-verifier
          path: verifier

      - name: Acquire the primary and repeat runs
        id: acquire
        run: |
          set -uo pipefail
          mkdir -p output
          sudo chown -R "${ISSUE_149_RUNTIME_UID}:${ISSUE_149_RUNTIME_GID}" output
          set +e
          docker run --rm \
            --platform linux/amd64 \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --user "${ISSUE_149_RUNTIME_UID}:${ISSUE_149_RUNTIME_GID}" \
            --env-file /dev/null \
            -e ISSUE_149_MODE=execute \
            -e ISSUE_149_HARNESS_REVISION="${ISSUE_149_HARNESS_REVISION}" \
            -e ISSUE_149_EXPECTED_UID="${ISSUE_149_RUNTIME_UID}" \
            -e ISSUE_149_EXPECTED_GID="${ISSUE_149_RUNTIME_GID}" \
            -e ISSUE_149_EXPECTED_IMAGE_DIGEST="${ISSUE_149_BASE_IMAGE_DIGEST}" \
            --tmpfs /tmp:rw,noexec,nosuid,size=512m \
            --tmpfs /run:rw,noexec,nosuid,size=16m \
            -v "$PWD/preparation/bundle:/opt/acquisition:ro" \
            -v "$PWD/preparation/input/truth-free-input-manifest.json:/input/truth-free-input-manifest.json:ro" \
            -v "$PWD/preparation/input/images:/input/images:ro" \
            -v "$PWD/output:/output:rw" \
            "${ISSUE_149_BASE_IMAGE}" \
            node /opt/acquisition/acquisition.mjs > acquisition-report.json
          ACQUIRE_STATUS=$?
          set -e
          # CAPTURED, not fatal. The path most in need of forensic verification
          # is a failed acquisition, and letting `set -e` end the job here is
          # exactly what skipped it. Adjudication happens after preservation.
          echo "{\"exitStatus\": ${ACQUIRE_STATUS}}" > acquisition-status.json
          echo "status=${ACQUIRE_STATUS}" >> "$GITHUB_OUTPUT"
          cat acquisition-status.json

      # ALWAYS. Actor 2 verifies whatever exists and produces a report even when
      # the evidence is incomplete. Plain node against the verifier bundle: this
      # job has no checkout, no package.json and no node_modules.
      - name: Actor 2 — verify the sealed raw evidence
        id: raw
        if: always()
        run: |
          set +e
          node verifier/verify.mjs \
            --raw output/raw \
            --manifest preparation/input/truth-free-input-manifest.json \
            --report raw-verification-report.json
          RAW_STATUS=$?
          set -e
          echo "status=${RAW_STATUS}" >> "$GITHUB_OUTPUT"
          echo "verified=$([ "${RAW_STATUS}" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # actions/download-artifact v4 — the minimal inventory, downloaded only
      # now, AFTER the container has exited.
      - name: Download the minimal identity inventory
        if: steps.raw.outputs.verified == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: issue-149-identity-inventory
          path: identity

      # JOB C. Only after Actor 2 verifies a complete committed artifact. A
      # missing inventory HALTS; it is never treated as an empty one.
      - name: Job C — historical identity-leak verification
        id: identity
        if: steps.raw.outputs.verified == 'true'
        run: |
          set -euo pipefail
          node verifier/verify.mjs \
            --raw output/raw \
            --manifest preparation/input/truth-free-input-manifest.json \
            --identity \
            --identity-inventory identity/identity-inventory.json \
            --identity-manifest identity/identity-inventory-manifest.json \
            --report identity-leak-report.json

      - name: Apply the durable-archive volume rule
        if: steps.raw.outputs.verified == 'true' && steps.identity.outcome == 'success'
        run: |
          set -euo pipefail
          BYTES=$(du -sb output | cut -f1)
          echo "{\"rawBytes\": ${BYTES}, \"durableArchiveStopRuleMb\": 100}"
          test "${BYTES}" -le 104857600 || {
            echo "RAW_EVIDENCE_EXCEEDS_DURABLE_ARCHIVE_LIMIT" >&2; exit 1; }

      # Verified evidence uploads ONLY after Actor 2 and Job C both succeed.
      # actions/upload-artifact v4
      - name: Upload the verified raw evidence
        id: upload
        if: steps.raw.outputs.verified == 'true' && steps.identity.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-149-raw-evidence
          path: |
            output
            acquisition-report.json
            acquisition-status.json
            image-identity.json
            raw-verification-report.json
            identity-leak-report.json
          retention-days: 30

      # actions/upload-artifact v4
      - name: Upload incomplete forensic output
        if: steps.raw.outputs.verified != 'true' || steps.identity.outcome != 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-149-incomplete-forensic-output
          path: |
            output
            acquisition-report.json
            acquisition-status.json
            image-identity.json
            raw-verification-report.json
            identity-leak-report.json
          retention-days: 30

      # ADJUDICATION, last — after the reports and the appropriate artifact have
      # been preserved. COMPLETE_WITH_NONDETERMINISM is a successful outcome.
      - name: Adjudicate the acquisition
        if: always()
        run: |
          set -euo pipefail
          echo "acquisition exit: ${{ steps.acquire.outputs.status }}"
          echo "actor 2 verified: ${{ steps.raw.outputs.verified }}"
          test "${{ steps.raw.outputs.verified }}" = "true" || {
            echo "ACQUISITION_NOT_VERIFIED" >&2; exit 1; }
          test "${{ steps.acquire.outputs.status }}" = "0" || {
            echo "ACQUISITION_RUNNER_REPORTED_FAILURE" >&2; exit 1; }

  verify-uploaded-artifact:
    name: Verify the uploaded artifact identity and contents
    needs: [resolve-mode, job-b-execute]
    if: needs.resolve-mode.outputs.mode == 'execute'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Narrowly scoped, only to read this run's artifact metadata.
      actions: read
    steps:
      - name: Require the artifact identity outputs
        run: |
          set -euo pipefail
          test -n "${{ needs.job-b-execute.outputs.artifactId }}" || {
            echo "ARTIFACT_ID_ABSENT" >&2; exit 1; }
          test -n "${{ needs.job-b-execute.outputs.artifactDigest }}" || {
            echo "ARTIFACT_DIGEST_ABSENT" >&2; exit 1; }
          test -n "${{ needs.job-b-execute.outputs.headSha }}" || {
            echo "PRODUCING_HEAD_SHA_ABSENT" >&2; exit 1; }

      # By exact ARTIFACT ID, not only by name. The download action validates the
      # digest itself, but a mismatch there is a warning — not a load-bearing
      # gate — so the comparison below is what actually decides.
      # By exact ARTIFACT ID. `artifact-ids` puts the workflow into
      # multiple-artifact mode, which nests each artifact under
      # `<path>/<artifact-name>/`; `merge-multiple: true` places the contents
      # directly at `path` instead. The rehearsal caught this: the round-trip
      # verification found zero items because it was reading the wrong level.
      # actions/download-artifact v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.job-b-execute.outputs.artifactId }}
          merge-multiple: true
          path: downloaded

      - name: Compare the artifact metadata digest to the upload output
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${{ needs.job-b-execute.outputs.artifactId }}" \
            > artifact-metadata.json
          METADATA_DIGEST=$(python3 -c "import json;print(json.load(open('artifact-metadata.json')).get('digest',''))")
          METADATA_RUN=$(python3 -c "import json;print(json.load(open('artifact-metadata.json')).get('workflow_run',{}).get('id',''))")
          UPLOAD_DIGEST="${{ needs.job-b-execute.outputs.artifactDigest }}"
          # Normalize: the upload output and the API may differ only by a
          # `sha256:` prefix.
          NORM_META="${METADATA_DIGEST#sha256:}"
          NORM_UP="${UPLOAD_DIGEST#sha256:}"
          echo "metadata run ${METADATA_RUN} vs this run ${GITHUB_RUN_ID}"
          test "${METADATA_RUN}" = "${GITHUB_RUN_ID}" || {
            echo "ARTIFACT_RUN_ASSOCIATION_MISMATCH" >&2; exit 1; }
          test -n "${NORM_META}" || { echo "ARTIFACT_METADATA_DIGEST_ABSENT" >&2; exit 1; }
          test "${NORM_META}" = "${NORM_UP}" || {
            echo "ARTIFACT_DIGEST_MISMATCH: ${NORM_META} vs ${NORM_UP}" >&2; exit 1; }

      # actions/download-artifact v4 — the verifier travels here too.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: issue-149-host-verifier
          path: verifier
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: issue-149-truth-free-preparation
          path: preparation

      - name: Re-verify the downloaded evidence, content level
        run: |
          set -euo pipefail
          node verifier/verify.mjs \
            --raw downloaded/output/raw \
            --manifest preparation/input/truth-free-input-manifest.json \
            --report downloaded-verification-report.json

      - name: Create the final verification receipt
        run: |
          set -euo pipefail
          RAW_DIGEST=$(sha256sum downloaded-verification-report.json | cut -d" " -f1)
          cat > verification-receipt.json <<JSON
          {
            "artifactId": "${{ needs.job-b-execute.outputs.artifactId }}",
            "uploadDigest": "${{ needs.job-b-execute.outputs.artifactDigest }}",
            "artifactUrl": "${{ needs.job-b-execute.outputs.artifactUrl }}",
            "headSha": "${{ needs.job-b-execute.outputs.headSha }}",
            "rawVerificationReportDigest": "${RAW_DIGEST}",
            "finalStatus": "VERIFIED"
          }
          JSON
          cat verification-receipt.json

      # actions/upload-artifact v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue-149-verification-receipt
          path: |
            verification-receipt.json
            artifact-metadata.json
            downloaded-verification-report.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # The NO-OCR verifier-transport rehearsal.
  #
  # The execute job is skipped under `discover`, so ordinary rediscovery never
  # exercises the host-side verification path at all. This job does — with no
  # checkout, plain Node, synthetic evidence, and no acquisition, extractor, OCR
  # or governed raw evidence anywhere in it. It is the executable proof that the
  # dormant host-side pipeline can actually run in a no-checkout job.
  # ---------------------------------------------------------------------------
  verifier-transport-rehearsal:
    name: Verifier-transport rehearsal (no OCR)
    needs: [resolve-mode, job-a-prepare]
    if: needs.resolve-mode.outputs.mode == 'discover'
    runs-on: ubuntu-latest
    steps:
      # NO repository checkout, deliberately.
      # actions/download-artifact v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: issue-149-host-verifier
          path: verifier
      # actions/download-artifact v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: issue-149-synthetic-rehearsal-evidence
          path: synthetic

      - name: Actor 2 runs with plain Node and no checkout
        run: |
          set -euo pipefail
          test ! -f package.json || { echo "UNEXPECTED_CHECKOUT" >&2; exit 1; }
          node verifier/verify.mjs \
            --raw synthetic/raw \
            --manifest synthetic/expected-items.json \
            --report rehearsal-raw-report.json

      # actions/download-artifact v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: issue-149-identity-inventory
          path: identity

      - name: Job C runs, and a MISSING inventory halts
        run: |
          set -euo pipefail
          node verifier/verify.mjs \
            --raw synthetic/raw \
            --manifest synthetic/expected-items.json \
            --identity \
            --identity-inventory identity/identity-inventory.json \
            --identity-manifest identity/identity-inventory-manifest.json \
            --report rehearsal-identity-report.json

          # …and with the inventory absent it MUST fail. A zero-marker scan is
          # never a clean scan.
          set +e
          node verifier/verify.mjs \
            --raw synthetic/raw \
            --manifest synthetic/expected-items.json \
            --identity \
            --identity-inventory identity/absent.json \
            --identity-manifest identity/absent-manifest.json \
            --report rehearsal-absent-report.json
          ABSENT_STATUS=$?
          set -e
          test "${ABSENT_STATUS}" -ne 0 || {
            echo "MISSING_INVENTORY_DID_NOT_HALT" >&2; exit 1; }
          echo "missing inventory halted with status ${ABSENT_STATUS}"

      - name: Planted failures must fail
        run: |
          set -euo pipefail
          for PLANT in missing-marker phantom-manifest-entry; do
            set +e
            node verifier/verify.mjs \
              --raw "synthetic/planted-${PLANT}/raw" \
              --manifest synthetic/expected-items.json \
              --report "rehearsal-${PLANT}-report.json"
            STATUS=$?
            set -e
            test "${STATUS}" -ne 0 || {
              echo "PLANTED_${PLANT}_DID_NOT_FAIL" >&2; exit 1; }
            echo "planted ${PLANT} failed as required"
          done

      # actions/upload-artifact v4
      - name: Upload the synthetic evidence, then redownload by ID
        id: rehearsalUpload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-149-rehearsal-roundtrip
          path: synthetic/raw
          retention-days: 1

      # actions/download-artifact v4 — see the note above on merge-multiple.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.rehearsalUpload.outputs.artifact-id }}
          merge-multiple: true
          path: roundtrip

      - name: Verify the round-tripped artifact identity and contents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${{ steps.rehearsalUpload.outputs.artifact-id }}" \
            > rehearsal-artifact-metadata.json
          META=$(python3 -c "import json;print(json.load(open('rehearsal-artifact-metadata.json')).get('digest',''))")
          UP="${{ steps.rehearsalUpload.outputs.artifact-digest }}"
          test "${META#sha256:}" = "${UP#sha256:}" || {
            echo "REHEARSAL_ARTIFACT_DIGEST_MISMATCH: ${META} vs ${UP}" >&2; exit 1; }
          node verifier/verify.mjs \
            --raw roundtrip \
            --manifest synthetic/expected-items.json \
            --report rehearsal-roundtrip-report.json
          echo "round-trip digest verified: ${META}"

      # actions/upload-artifact v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue-149-rehearsal-reports
          path: |
            rehearsal-*.json
          retention-days: 7
